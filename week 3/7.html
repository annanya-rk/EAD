<!DOCTYPE html>
<html>
<head>
    <title>Simple Web Page Layout</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            display: flex;
            min-height: 400px;
        }

        .sidebar {
            background-color: #f4f4f4;
            width: 25%;
            padding: 20px;
        }

        .main {
            background-color: #ffffff;
            width: 75%;
            padding: 20px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

        /* Responsive Layout */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar,
            .main {
                width: 100%;
            }
        }
    </style>

</head>
<body>

<header>
    <h1>My Website</h1>
</header>

<div class="container">
    <div class="sidebar">
        <h2>Sidebar</h2>
        <p>Links or menu items</p>
    </div>

    <div class="main">
        <h2>Main Content</h2>
        <p>This is the main area of the page.</p>
    </div>
</div>

<footer>
    <p>Footer Content</p>
</footer>

</body>
</html>
