<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef1f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            width: 300px;
            background-color: #f2f2f2;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 20px;
            text-align: center;
        }

        .card h2 {
            margin-top: 0;
            color: #333;
        }

        .card p {
            margin: 8px 0;
        }
    </style>

</head>

<body>

<div class="card">
    <h2>Student Name: Annanya Reddy </h2>
    <p><b>Roll Number:</b> 160124737071</p>
    <p><b>Department:</b> Information Technology</p>
</div>

</body>
</html>
