<!DOCTYPE html>
<html>
<head>
    <title>CSS Positioning</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        .container {
            position: relative;
            height: 350px;
            border: 2px dashed gray;
            padding-top: 20px;
        }

        .box {
            width: 150px;
            height: 100px;
            color: white;
            display: inline-block;
            text-align: center;
            line-height: 100px;
            margin: 10px;
        }

        .static-box {
            background-color: #4CAF50;
            position: static;
        }

        .relative-box {
            background-color: #2196F3;
            position: relative;
            top: 20px;
            left: 20px;
        }

        .absolute-box {
            background-color: #f44336;
            position: absolute;
            top: 200px;
            left: 40px;
        }
    </style>

</head>
<body>

<h2>CSS Positioning Example</h2>

<div class="container">
    <div class="box static-box">Static</div>
    <div class="box relative-box">Relative</div>
    <div class="box absolute-box">Absolute</div>
</div>

</body>
</html>
