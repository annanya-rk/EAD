<!DOCTYPE html>
<html>
<head>
    <title>CSS Navigation Bar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            background-color: #333;
            overflow: hidden;
        }

        li {
            float: left;
        }

        li a {
            display: block;
            color: white;
            padding: 14px 20px;
            text-decoration: none;
        }

        li a:hover {
            background-color: #555;
        }

        /* Page content */
        .content {
            text-align: center;
            margin-top: 50px;
        }
    </style>

</head>
<body>

<ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
</ul>

<div class="content">
    <h2>Welcome to Our Website</h2>
    <p>This page demonstrates a simple CSS navigation bar.</p>
</div>

</body>
</html>
