<!DOCTYPE html>
<html>
<head>
    <title>Box Model Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef1f5;
            text-align: center;
            margin: 0;
            padding-top: 80px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .box {
            width: 300px;
            height: 150px;

            padding: 20px;          /* inside space */
            margin: 40px auto;      /* outside space */

            border: 4px solid blue; /* border */
            background-color: lightyellow;

            font-size: 20px;
            font-weight: bold;

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>

</head>
<body>

<h2>CSS Box Model Demonstration</h2>

<div class="box">
    CSS Box Model
</div>

</body>
</html>
