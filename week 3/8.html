<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Form Styling</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #6fcfe7;
            margin: 0;
        }

        .login-box {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background: #fff3b0;
            border: 1px solid #c27430;
            border-radius: 6px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            border: 1px solid #902ec4;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 8px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: #e95373;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>Login</h2>

    <form>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button>Login</button>
    </form>
</div>

</body>
</html>
