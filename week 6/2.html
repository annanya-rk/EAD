<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
<div class="row">
<div class="col-md-8 mx-auto">
<h3 class="text-center text-primary mb-4">Engineering Student Registration Form</h3>
<form onsubmit="showAlert(event)">
<div class="row mb-3">
<div class="col-md-6">
<label class="form-label">Student Name</label>
<input type="text" class="form-control" placeholder="Enter your name" required>
</div>
<div class="col-md-6">
<label class="form-label">Roll Number</label>
<input type="text" class="form-control" placeholder="Enter roll number" required>
</div>
</div>
<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" placeholder="Enter your email" required>
</div>
<div class="mb-3">
<label class="form-label">Gender</label><br>
<div class="form-check form-check-inline">
<input class="form-check-input" type="radio" name="gender" required>
<label class="form-check-label">Male</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" type="radio" name="gender">
<label class="form-check-label">Female</label>
</div>
<div class="form-check form-check-inline">
<input class="form-check-input" type="radio" name="gender">
<label class="form-check-label">Other</label>
</div>
</div>
<div class="mb-3">
<label class="form-label">Department</label>
<select class="form-select" required>
<option selected disabled>Select Engineering Department</option>
<option>Computer Science Engineering (CSE)</option>
<option>Information Technology (IT)</option>
<option>Electronics & Communication Engineering (ECE)</option>
<option>Electrical Engineering (EE)</option>
<option>Mechanical Engineering (ME)</option>
<option>Civil Engineering (CE)</option>
<option>Artificial Intelligence & Data Science (AI & DS)</option>
<option>Artificial Intelligence & Machine Learning (AI & ML)</option>
</select>
</div>
<div class="mb-3">
<label class="form-label">Subjects</label>
<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Data Structures</label>
</div>
<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Database Management System</label>
</div>
<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Web Technology</label>
</div>
<div class="form-check">
<input class="form-check-input" type="checkbox">
<label class="form-check-label">Operating System</label>
</div>
</div>
<div class="mb-3">
<label class="form-label">Upload Photo</label>
<input type="file" class="form-control">
</div>
<div class="text-center">
<button type="submit" class="btn btn-success me-2">Submit</button>
<button type="reset" class="btn btn-danger">Reset</button>
</div>
</form>
<div id="successAlert" class="alert alert-success mt-4 d-none">
Registration Submitted Successfully!
</div>
</div>
</div>
</div>
<script>
function showAlert(event){
event.preventDefault();
document.getElementById("successAlert").classList.remove("d-none");
}
</script>
</body>
</html>
