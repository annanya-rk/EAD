<html>
    <head>
        <title>Feedback form</title>
    </head>
    <body>
        <h2>Feedback form</h2>
        <form>
            <label>Name:</label><br>
            <input type="text" name="Name"><br><br>
            <label>email:</label><br>
            <input type="email" name="email"><br><br>
            <label>feedback msg:</label><br>
            <textarea id="feedback" name="feedback" rows="10" cols="20" required></textarea> 
            <label>how satisfied are you?</label><br>
            <input type="radio" name="how satisfied are you?" value="satisfied">satisfied<br>
            <input type="radio" name="how satisfied are you?" value="neutral">neutral<br>
            <input type="radio" name="how satisfied are you?" value="unsatisfied">unsatisfied<br><br> 
            <button type="submit">submit</button>
        </form>
    </body>
    </html>
